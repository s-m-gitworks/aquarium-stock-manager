<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店舗間移動登録</title>
</head>
<body>
    <h1>店舗間移動登録</h1>
    <form th:action="@{/transfer}" th:object="${transfer}" method="post">

        <div>
           <label>移動元店舗</label>
            <select th:field="*{fromStore.id}" required>
                <option value="">選択してください</option>
                <option th:each="fromStore : ${stores}"
                        th:value="${fromStore.id}"
                        th:text="${fromStore.name}">
                </option>
            </select> 
        </div>

        <div>
           <label>移動先店舗</label>
            <select th:field="*{toStore.id}" required>
                <option value="">選択してください</option>
                <option th:each="toStore : ${stores}"
                        th:value="${toStore.id}"
                        th:text="${toStore.name}">
                </option>
            </select> 
        </div>

        <div>
            <label>魚種</label>
            <select th:field="*{fishSpecies.id}" required>
                <option value="">選択してください</option>
                <option th:each="fishSpecies : ${fishSpeciesList}"
                        th:value="${fishSpecies.id}"
                        th:text="${fishSpecies.name}">
                </option>
            </select>
        </div>

        <div>
            <label>数量</label>
            <input type="number" th:field="*{quantity}" min="1" required>
        </div>

        <div>
            <label>単位</label>
            <select th:field="*{unit}" required>
                <option value="">選択してください</option>
                <option th:each="unit : ${salesUnits}"
                        th:value="${unit}"
                        th:text="${unit.displayName}">
                </option>
            </select>
        </div>

        <div>
            <label>移動日</label>
            <input type="date"
                   name="transferDate"
                   th:value="${#temporals.format(transfer.transferDate, 'yyyy-MM-dd')}"
                   required>
        </div>

        <button type="submit">登録</button>
    </form>
</body>
</html>
