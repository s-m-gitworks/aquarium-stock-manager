<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>販売価格登録</title>
</head>
<body>
    <h1>販売価格登録</h1>

    <form th:action="@{/sales-prices}" th:object="${salesPrice}" method="post">
        
        <div>
            <label>魚種</label>
            <select th:field="*{fishSpecies.id}" required>
                <option value="">選択してください</option>
                <option th:each="fishSpecies : ${fishSpeciesList}"
                        th:value="${fishSpecies.id}"
                        th:text="${fishSpecies.name}">
                </option>
            </select>
        </div>

        <div>
            <label>数量</label>
            <input type="number" th:field="*{quantity}" min="1" required>
        </div>

        <div>
            <label>単位</label>
            <select th:field="*{unit}" required>
                <option value="">選択してください</option>
                <option th:each="unit : ${salesUnits}"
                        th:value="${unit}"
                        th:text="${unit.displayName}">
                </option>
            </select>
        </div>

        <div>
            <label>販売価格(税抜)</label>
            <input type="number" th:field="*{priceExcludingTax}" required>
        </div>

        <button type="submit">登録</button>
    </form>
</body>
</html>
