<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>販売登録</title>
</head>
<body>
    <h1>販売登録</h1>
    
    <form th:action="@{/sales}" th:object="${sales}" method="post">
        <div>
            <label>店舗</label>
            <select th:field="*{store.id}" required>
                <option value="">選択してください</option>
                <option th:each="store : ${stores}"
                        th:value="${store.id}"
                        th:text="${store.name}">
                </option>
            </select>
        </div>

        <div>
            <label>魚種</label>
            <select th:field="*{fishSpecies.id}" required>
                <option value="">選択して下さい</option>
                <option th:each="fishSpecies : ${fishSpeciesList}"
                        th:value="${fishSpecies.id}"
                        th:text="${fishSpecies.name}">
                </option>
            </select>
        </div>

        <div>
            <label>販売日</label>
            <input type="date"
                name="salesDate"
                th:value="${#temporals.format(sales.salesDate, 'yyyy-MM-dd')}"
                required>
        </div>

        <div>
            <label>販売数</label>
            <input type="number" th:field="*{quantity}" min="1" required>
        </div>

        <div>
            <label>単位</label>
            <select th:field="*{unit}">
                <option value="">選択してください</option>
                <option th:each="unit : ${salesUnits}"
                        th:value="${unit}"
                        th:text="${unit.displayName}">
                </option>
            </select>
        </div>

        <div>
            <label>販売価格(税抜)</label>
            <input type="number" th:field="*{priceExcludingTax}" min="0">
        </div>

        <button type="submit">登録</button>
    </form>
</body>
</html>
