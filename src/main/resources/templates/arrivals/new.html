<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入荷登録</title>
</head>
<body>
    <h1>入荷登録</h1>

    <form th:action="@{/arrivals}" th:object="${arrival}" method="post">
        <div>
            <label>店舗</label>
            <select th:field="*{store.id}" required>
                <option value="">選択してください</option>
                <option th:each="store : ${stores}"
                        th:value="${store.id}"
                        th:text="${store.name}">
                </option>
            </select>
        </div>

        <div>
            <label>魚種</label>
            <select th:field="*{fishSpecies.id}" required>
                <option value="">選択してください</option>
                <option th:each="fishSpecies : ${fishSpeciesList}"
                        th:value="${fishSpecies.id}"
                        th:text="${fishSpecies.name}">
                </option>
            </select>
        </div>

        <div>
            <label>仕入先</label>
            <select th:field="*{supplier.id}" required>
                <option value="">選択して下さい</option>
                <option th:each="supplier : ${suppliers}"
                        th:value="${supplier.id}"
                        th:text="${supplier.name}">
                </option>
            </select>
        </div>

        <div>
            <label>入荷日</label>
            <input type="date" th:field="*{arrivalDate}" required>
        </div>

        <div>
            <label>数量</label>
            <input type="number" th:field="*{quantity}" min="1" required>
        </div>

        <div>
            <label>仕入単価</label>
            <input type="number" th:field="*{costPrice}" step="0.1" min="0" required>
        </div>

        <div>
            <label>単位</label>
            <select th:field="*{unit}" required>
                <option th:each="unit : ${salesUnits}"
                        th:value="${unit}"
                        th:text="${unit}">
                </option>
            </select>
        </div>

        <div>
            <label>ステータス</label>
            <select th:field="*{status}" required>
                <option th:each="status : ${arrivalStatuses}"
                        th:value="${status}"
                        th:text="${status}">
                </option>
            </select>
        </div>

        <button type="submit">登録</button>
    </form>

    <p>
        <a th:href="@{/stocks}">在庫一覧へ戻る</a>
    </p>
</body>
</html>
