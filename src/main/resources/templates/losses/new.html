<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロス登録</title>
</head>
<body>
    <h1>ロス登録</h1>

    <form th:action="@{/losses}" th:object="${loss}" method="post">
        <div>
            <label>店舗</label>
            <select th:field="*{store.id}" required>
                <option value="">選択してください</option>
                <option th:each="store : ${stores}"
                        th:value="${store.id}"
                        th:text="${store.name}">
                </option>
            </select>
        </div>

        <div>
            <label>魚種</label>
            <select th:field="*{fishSpecies.id}" required>
                <option value="">選択してください</option>
                <option th:each="fishSpecies : ${fishSpeciesList}"
                        th:value="${fishSpecies.id}"
                        th:text="${fishSpecies.name}">
                </option>
            </select>
        </div>

        <div>
            <label>数量</label>
            <input type="number" th:field="*{quantity}" min="1" required>
        </div>

        <div>
            <label>ロス日</label>
            <input type="date"
                name="lossDate"
                th:value="${#temporals.format(loss.lossDate, 'yyyy-MM-dd')}"
                required>
        </div>

        <div>
            <label>ロス理由</label>
            <select th:field="*{lossReason}" required>
                <option value="">選択してください</option>
                <option th:each="lossReason : ${lossReasons}"
                        th:value="${lossReason}"
                        th:text="${lossReason}">
                </option>
            </select>
        </div>

        <div>
            <label>備考</label>
            <textarea th:field="*{note}"></textarea>
        </div>

        <button type="submit">登録</button>
    </form>
</body>
</html>
